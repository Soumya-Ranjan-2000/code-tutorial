<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tutorial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>

</head>
<body class="container-fluid">
    <header>
        <nav class="p-2 text-white d-flex justify-content-between bg-dark">
            <div class="h2">Tech Videos</div>
            <div class="fs-5">
                <!-- Added IDs for navigation -->
                <span class="me-4"><a id="navHome" href="#">Home</a></span>
                <span class="me-4"><a id="navVideos" href="#">Videos</a></span>
                <span class="me-4"><a id="navAbout" href="#">About</a></span>
                <span class="me-4"><a id="navContact" href="#">Contact</a></span>
            </div>
            <div class="fs-5">
                <span class="bi bi-person-fill"> <a id="signin" href="#">Signin</a></span>
            </div>
        </nav>
        <div class="text-white text-center mt-4 justify-content-center d-flex">
            <div>
                <div class="h1">Learn Coding</div>
                <p>Java, C#, JavaScript, PHP, HTML..</p>
                <div class="mt-3 input-group" id="emailContainer">
                    <input class="form-control" id="Email" type="email" placeholder="Your email address"> 
                    <button class="btn btn-warning" id="btnGetStarted">
                        Get Started <span class="bi bi-chevron-right"></span>
                    </button>
                </div>
                <div id="error" class="text-white fw-bold fs-5"></div>
                <div class="mt-3 input-group" id="passwordContainer">
                    <input class="form-control" id="Password" type="password" placeholder="Your password"> 
                    <button class="btn btn-warning" id="btnSignIn">
                        Signin <span class="bi bi-chevron-right"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <section>
        <div class="box">
            <img src="images/card-1.jpg" class="card-img-top">
            <div>
                <button class="btn btn-dark join-course w-100">Join Course</button>
            </div>
        </div>
        <div class="box">
            <img src="images/card-2.jpg" class="card-img-top">
            <div>
                <button class="btn btn-dark join-course w-100">Join Course</button>
            </div>
        </div>
        <div class="box">
            <img src="images/card-3.jpg" class="card-img-top">
            <div>
                <button class="btn btn-dark join-course w-100">Join Course</button>
            </div>
        </div>
        <div class="box">
            <img src="images/card-4.jpg" class="card-img-top">
            <div>
                <button class="btn btn-dark join-course w-100">Join Course</button>
            </div>
        </div>
    </section>
</body>
</html>
