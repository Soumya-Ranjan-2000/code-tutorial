<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  
  <!-- jQuery + Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!--  index.js handles functionality -->
  <script src="index.js"></script>
</head>
<body>
  <div class="d-flex justify-content-center mt-5">
    <div class="card shadow-lg" style="width: 450px; background-color: rgba(255,255,255,0.95);">
      <div class="card-header bg-success text-white text-center">
        <h4><i class="bi bi-person-plus-fill"></i> User Register</h4>
      </div>
      <div class="card-body">
        <form id="registerForm">
          <div class="mb-3">
            <label for="UserId" class="form-label">User Id</label>
            <input id="UserId" type="text" class="form-control" placeholder="Enter unique ID" required>
          </div>
          <div class="mb-3">
            <label for="UserName" class="form-label">User Name</label>
            <input id="UserName" type="text" class="form-control" placeholder="Enter your name" required>
          </div>
          <div class="mb-3">
            <label for="RPassword" class="form-label">Password</label>
            <input type="password" id="RPassword" class="form-control" placeholder="Choose a strong password" required>
          </div>
          <div class="mb-3">
            <label for="REmail" class="form-label">Email</label>
            <input type="email" id="REmail" class="form-control" placeholder="example@email.com" required>
          </div>
          <div class="mb-3">
            <label for="Mobile" class="form-label">Mobile</label>
            <input type="text" id="Mobile" class="form-control" placeholder="Enter your mobile number" required>
          </div>
          <div class="d-flex justify-content-between">
            <button type="button" id="btnRegister" class="btn btn-warning w-50 me-2">
              <i class="bi bi-check-circle-fill"></i> Register
            </button>
            <button type="button" id="btnCancel" class="btn btn-secondary w-50">
              <i class="bi bi-x-circle"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
