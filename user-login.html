<div class="d-flex justify-content-center mt-4">
  <div class="card shadow-lg" style="width: 400px; background-color: rgba(255,255,255,0.95);">
    <div class="card-header bg-primary text-white text-center">
      <h4><i class="bi bi-person-circle"></i> User Login</h4>
    </div>
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label for="LoginUserId" class="form-label">User Id</label>
          <input type="text" id="LoginUserId" class="form-control" placeholder="Enter your User Id">
        </div>
        <div class="mb-3">
          <label for="LoginPassword" class="form-label">Password</label>
          <input type="password" id="LoginPassword" class="form-control" placeholder="Enter your password">
        </div>
        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-warning w-50 me-2" id="btnLogin">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>
          <button type="button" class="btn btn-secondary w-50" id="btnCancel">
            <i class="bi bi-x-circle"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
